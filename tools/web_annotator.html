<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Super Brain Annotator (V13)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial; background: #111; color: #eee; display: flex; height: 100vh; overflow: hidden; }

#sidebar { width: 220px; background: #1a1a1a; padding: 10px; display: flex; flex-direction: column; border-right: 1px solid #333; flex-shrink: 0; }
#sidebar h2 { font-size: 13px; color: #888; margin-bottom: 8px; }
#image-list { flex: 1; overflow-y: auto; list-style: none; }
#image-list li { padding: 5px 8px; cursor: pointer; border-radius: 4px; margin-bottom: 2px; font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#image-list li:hover { background: #333; }
#image-list li.active { background: #0066cc; color: #fff; }

#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#toolbar { background: #1a1a1a; padding: 8px 16px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
#toolbar button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-0 { background: #0066cc; color: #fff; }
.btn-1 { background: #cc0000; color: #fff; }
.btn-2 { background: #00aa00; color: #fff; }
.btn-3 { background: #00aaaa; color: #fff; }
.btn-del { background: #aa0000; color: #fff; }
.btn-save { background: #0066cc; color: #fff; }
#toolbar .info { margin-left: auto; font-size: 12px; color: #888; }

#content { flex: 1; display: flex; overflow: hidden; }

#canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: auto; padding: 12px; }
canvas { max-width: 100%; max-height: 100%; cursor: crosshair; display: block; }

#right-panel { width: 320px; background: #1a1a1a; border-left: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
#right-panel h3 { font-size: 12px; color: #888; padding: 8px 10px; border-bottom: 1px solid #333; }
#label-list { flex: 1; overflow-y: auto; padding: 4px; }

.label-item { display: flex; align-items: center; padding: 5px 8px; margin-bottom: 3px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
.label-item:hover { border-color: #555; }
.label-item.selected { border-color: #0066cc; background: #001133; }
.label-item.cls-0 { background: #001133; border-left: 3px solid #0066cc; }
.label-item.cls-1 { background: #330011; border-left: 3px solid #cc0000; }
.label-item.cls-2 { background: #003300; border-left: 3px solid #00aa00; }
.label-item.cls-3 { background: #003333; border-left: 3px solid #00aaaa; }
.label-item.other { background: #222; border-left: 3px solid #888; }
.label-item .lbl-class { width: 70px; font-weight: bold; }
.label-item .lbl-coords { flex: 1; color: #888; font-size: 10px; }
.label-item .lbl-del { background: #aa0000; color: #fff; border: none; border-radius: 3px; padding: 2px 6px; cursor: pointer; font-size: 11px; margin-left: 4px; }

#saved-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #00aa00; padding: 8px 20px; border-radius: 4px; font-size: 14px; display: none; z-index: 100; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>图片列表</h2>
  <ul id="image-list"></ul>
</div>

<div id="main">
  <div id="toolbar">
    <button class="btn-0" onclick="setMode('player')">Player [0]</button>
    <button class="btn-1" onclick="setMode('monster')">Monster [1]</button>
    <button class="btn-2" onclick="setMode('platform')">Platform [2]</button>
    <button class="btn-3" onclick="setMode('rope')">Rope [3]</button>
    <button class="btn-del" onclick="setMode('delete')">Delete [D]</button>
    <button class="btn-save" onclick="saveLabels()">Save [S]</button>
    <span class="info" id="info"></span>
  </div>
  <div id="content">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div id="right-panel">
      <h3>Labels (<span id="box-count">0</span>)</h3>
      <div id="label-list"></div>
    </div>
  </div>
</div>

<div id="saved-msg">Saved!</div>

<script>
const API = '';
let images = [];
let current = null;
let allBoxes = [];
let imgW = 1, imgH = 1;
let imgUrl = '';
let isDragging = false;
let dragStart = null;
let dragBox = null;
let selectedIdx = -1;
let mode = 'platform';

// V13: 连续 0-3
const MODE_CLS = {player: 0, monster: 1, platform: 2, rope: 3};
const CLS_NAMES = {0: 'Player', 1: 'Monster', 2: 'Platform', 3: 'Rope'};
const CLS_COLORS_HTML = {0: '#0066cc', 1: '#cc0000', 2: '#00aa00', 3: '#00aaaa'};
const CLS_COLORS_CANVAS = {0: 'rgb(0,102,204)', 1: 'rgb(204,0,0)', 2: 'rgb(0,170,0)', 3: 'rgb(0,170,170)'};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

async function loadList() {
  const r = await fetch(API + '/api/images');
  images = await r.json();
  const ul = document.getElementById('image-list');
  ul.innerHTML = '';
  images.forEach(n => {
    const li = document.createElement('li');
    li.textContent = n;
    li.onclick = () => loadImage(n);
    ul.appendChild(li);
  });
  if (images.length) loadImage(images[0]);
}

async function loadImage(name) {
  current = name;
  selectedIdx = -1;
  document.querySelectorAll('#image-list li').forEach(li => li.classList.toggle('active', li.textContent === name));
  const r = await fetch(API + '/api/image/' + encodeURIComponent(name));
  const d = await r.json();
  imgW = d.width; imgH = d.height;
  canvas.width = imgW; canvas.height = imgH;
  imgUrl = 'data:image/jpeg;base64,' + d.image;
  // 过滤非法类别 (旧版本可能残留 4/5)
  allBoxes = (d.existing || []).filter(b => b.cls in CLS_NAMES).map(b => ({...b}));
  renderLabelList();
  redraw();
  document.getElementById('info').textContent = name + ' | ' + allBoxes.length + ' boxes';
}

function redraw() {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    allBoxes.forEach((b, i) => drawOneBox(b, i === selectedIdx));
    if (dragBox) drawOneBox(dragBox, false, true);
  };
  img.src = imgUrl;
}

function drawOneBox(b, selected, dashed) {
  const x1 = (b.cx - b.bw / 2) * imgW;
  const y1 = (b.cy - b.bh / 2) * imgH;
  const x2 = (b.cx + b.bw / 2) * imgW;
  const y2 = (b.cy + b.bh / 2) * imgH;
  const color = CLS_COLORS_CANVAS[b.cls] || 'rgb(136,136,136)';
  ctx.strokeStyle = color;
  ctx.lineWidth = (selected || dashed) ? 3 : 2;
  if (dashed) ctx.setLineDash([5, 5]);
  else ctx.setLineDash([]);
  ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
  ctx.setLineDash([]);
  if (b.cls in CLS_NAMES) {
    ctx.fillStyle = color;
    ctx.font = 'bold 13px Arial';
    ctx.fillText(CLS_NAMES[b.cls], x1 + 2, y1 - 3);
  }
  if (selected) {
    ctx.fillStyle = 'rgba(0,100,255,0.15)';
    ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
  }
}

function setMode(m) { mode = m; }

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return [
    (e.clientX - r.left) * (canvas.width / r.width) / imgW,
    (e.clientY - r.top) * (canvas.height / r.height) / imgH
  ];
}

canvas.addEventListener('mousedown', e => {
  const [cx, cy] = getPos(e);
  if (mode === 'delete') return;
  isDragging = true;
  dragStart = { cx, cy };
  dragBox = { cls: MODE_CLS[mode] ?? 2, cx, cy, bw: 0.001, bh: 0.001 };
  redraw();
});

canvas.addEventListener('mousemove', e => {
  if (!isDragging || !dragBox) return;
  const [cx, cy] = getPos(e);
  dragBox = {
    cls: MODE_CLS[mode] ?? 2,
    cx: (dragStart.cx + cx) / 2,
    cy: (dragStart.cy + cy) / 2,
    bw: Math.abs(cx - dragStart.cx),
    bh: Math.abs(cy - dragStart.cy)
  };
  redraw();
});

canvas.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  if (dragBox && dragBox.bw > 0.003 && dragBox.bh > 0.003) {
    allBoxes.push({...dragBox});
    renderLabelList();
    redraw();
  }
  dragBox = null;
  redraw();
});

canvas.addEventListener('click', e => {
  if (mode !== 'delete') return;
  const [cx, cy] = getPos(e);
  for (let i = allBoxes.length - 1; i >= 0; i--) {
    const b = allBoxes[i];
    if (Math.abs(cx - b.cx) < b.bw / 2 + 0.01 && Math.abs(cy - b.cy) < b.bh / 2 + 0.01) {
      allBoxes.splice(i, 1);
      selectedIdx = -1;
      renderLabelList();
      redraw();
      return;
    }
  }
});

function renderLabelList() {
  const list = document.getElementById('label-list');
  document.getElementById('box-count').textContent = allBoxes.length;
  list.innerHTML = '';
  allBoxes.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'label-item ' + ('cls-' + b.cls in CLS_NAMES ? b.cls : 'other');
    if (i === selectedIdx) div.classList.add('selected');
    const clsName = CLS_NAMES[b.cls] || ('C' + b.cls);
    const clsColor = CLS_COLORS_HTML[b.cls] || '#888';
    div.innerHTML = '<span class="lbl-class" style="color:' + clsColor + '">' + clsName + '</span>' +
      '<span class="lbl-coords">cx=' + b.cx.toFixed(3) + ' cy=' + b.cy.toFixed(3) + ' bw=' + b.bw.toFixed(3) + ' bh=' + b.bh.toFixed(3) + '</span>' +
      '<button class="lbl-del" onclick="deleteBox(' + i + ')">X</button>';
    div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') { selectedIdx = i; renderLabelList(); redraw(); } };
    list.appendChild(div);
  });
}

function deleteBox(i) {
  allBoxes.splice(i, 1);
  if (selectedIdx === i) selectedIdx = -1;
  else if (selectedIdx > i) selectedIdx--;
  renderLabelList();
  redraw();
}

async function saveLabels() {
  if (!current) return;
  await fetch(API + '/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image_name: current, boxes: allBoxes })
  });
  const msg = document.getElementById('saved-msg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 1500);
  document.getElementById('info').textContent = current + ' | Saved ' + allBoxes.length + ' boxes';
}

document.addEventListener('keydown', e => {
  if (e.key === 's' || e.key === 'S') saveLabels();
  if (e.key === 'd' || e.key === 'D') setMode('delete');
  if (e.key === '0') setMode('player');
  if (e.key === '1') setMode('monster');
  if (e.key === '2') setMode('platform');
  if (e.key === '3') setMode('rope');
  if (e.key === 'Delete' && selectedIdx >= 0) { deleteBox(selectedIdx); }
  if (e.key === 'ArrowRight' && images.length) {
    const i = images.indexOf(current);
    if (i >= 0 && i < images.length - 1) loadImage(images[i + 1]);
  }
  if (e.key === 'ArrowLeft' && images.length) {
    const i = images.indexOf(current);
    if (i > 0) loadImage(images[i - 1]);
  }
});

loadList();
</script>
</body>
</html>
